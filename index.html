<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poängräknare</title>
<meta name="theme-color" content="#123e7c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poäng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  @font-face {
    font-family: 'Bebas Neue';
    src: url('fonts/BebasNeue-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #0b0b0c;
    --blue-a: #1a4c94;
    --blue-b: #123e7c;
    --red-a: #c2222f;
    --red-b: #a11d2b;
    --seam: rgba(255,255,255,0.18);
    --console: #1c1c1e;
    --console-light: #38383a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; }
  }
  :root[data-theme="dark"] { --bg: #000; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    font-family: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
  }

  .board {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
    position: relative;
    touch-action: none;
    color: #fff;
    padding: env(safe-area-inset-top) 6vw env(safe-area-inset-bottom);
  }

  .field.top {
    background: radial-gradient(circle at 50% 65%, var(--blue-a) 0%, var(--blue-b) 75%);
    border-bottom: 1px solid var(--seam);
    padding-top: max(env(safe-area-inset-top), 5vmin);
  }
  .field.bottom {
    background: radial-gradient(circle at 50% 35%, var(--red-a) 0%, var(--red-b) 75%);
    border-top: 1px solid var(--seam);
    padding-bottom: max(env(safe-area-inset-bottom), 5vmin);
  }

  .team-name {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: inherit;
    font-size: clamp(1.1rem, 6vmin, 2.1rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    width: min(90vw, 480px);
    caret-color: #fff;
  }
  .team-name::placeholder { color: rgba(255,255,255,0.55); }
  .team-name:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 4px; border-radius: 4px; }

  .score {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: inherit;
    font-size: clamp(4.5rem, 32vmin, 13rem);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 24px rgba(0,0,0,0.28);
  }
  @media (prefers-reduced-motion: no-preference) {
    .score.pulse { animation: pulse 0.2s ease; }
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .reset-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--console);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
    padding: 0;
  }
  .reset-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .reset-btn .fill {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--console-light);
    transform: scale(0);
    transform-origin: center;
  }
  .reset-btn.holding .fill { animation: fillUp 0.6s linear forwards; }
  @keyframes fillUp { from { transform: scale(0); } to { transform: scale(1); } }
  .reset-btn .icon {
    position: relative;
    color: rgba(255,255,255,0.7);
    font-family: Arial, sans-serif;
    font-size: 20px;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="board" id="board">
  <div class="field top" id="field1">
    <input class="team-name" id="name1" placeholder="LAG 1" maxlength="18" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="score" id="score1">0</div>
  </div>

  <button class="reset-btn" id="resetBtn" aria-label="Nollställ poängen" type="button">
    <span class="fill"></span>
    <span class="icon">&#8635;</span>
  </button>

  <div class="field bottom" id="field2">
    <input class="team-name" id="name2" placeholder="LAG 2" maxlength="18" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="score" id="score2">0</div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'poangraknare-state';
  var state = { name1: '', name2: '', score1: 0, score2: 0 };

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (typeof parsed.name1 === 'string') state.name1 = parsed.name1;
        if (typeof parsed.name2 === 'string') state.name2 = parsed.name2;
        if (typeof parsed.score1 === 'number') state.score1 = parsed.score1;
        if (typeof parsed.score2 === 'number') state.score2 = parsed.score2;
      }
    } catch (e) { /* localStorage unavailable, start fresh */ }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* ignore */ }
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  var name1 = document.getElementById('name1');
  var name2 = document.getElementById('name2');
  var score1El = document.getElementById('score1');
  var score2El = document.getElementById('score2');
  var field1 = document.getElementById('field1');
  var field2 = document.getElementById('field2');
  var resetBtn = document.getElementById('resetBtn');

  loadState();
  name1.value = state.name1;
  name2.value = state.name2;
  score1El.textContent = state.score1;
  score2El.textContent = state.score2;

  name1.addEventListener('input', function () { state.name1 = name1.value; saveState(); });
  name2.addEventListener('input', function () { state.name2 = name2.value; saveState(); });
  name1.addEventListener('focus', function () { name1.select(); });
  name2.addEventListener('focus', function () { name2.select(); });

  function pulse(el) {
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function changeScore(key, el, delta) {
    state[key] = state[key] + delta;
    el.textContent = state[key];
    pulse(el);
    vibrate(12);
    saveState();
  }

  function attachDrag(fieldEl, onUp, onDown) {
    var startY = null;
    var active = false;
    var threshold = 40;

    function isNameInput(target) {
      return target && target.closest && target.closest('.team-name');
    }

    function start(y, target) {
      if (isNameInput(target)) { active = false; startY = null; return; }
      startY = y;
      active = true;
    }

    function finish(y) {
      if (!active || startY === null) return;
      var delta = y - startY;
      if (delta <= -threshold) onUp();
      else if (delta >= threshold) onDown();
      active = false;
      startY = null;
    }

    fieldEl.addEventListener('touchstart', function (e) {
      start(e.touches[0].clientY, e.target);
    }, { passive: true });

    fieldEl.addEventListener('touchmove', function (e) {
      if (active) e.preventDefault();
    }, { passive: false });

    fieldEl.addEventListener('touchend', function (e) {
      finish(e.changedTouches[0].clientY);
    });

    fieldEl.addEventListener('mousedown', function (e) {
      start(e.clientY, e.target);
    });
    window.addEventListener('mouseup', function (e) {
      if (active) finish(e.clientY);
    });
  }

  attachDrag(field1, function () { changeScore('score1', score1El, 1); }, function () { changeScore('score1', score1El, -1); });
  attachDrag(field2, function () { changeScore('score2', score2El, 1); }, function () { changeScore('score2', score2El, -1); });

  var pressTimer = null;
  function startPress(e) {
    e.stopPropagation();
    resetBtn.classList.remove('holding');
    void resetBtn.offsetWidth;
    resetBtn.classList.add('holding');
    pressTimer = setTimeout(function () {
      state.score1 = 0;
      state.score2 = 0;
      score1El.textContent = 0;
      score2El.textContent = 0;
      vibrate([15, 30, 15]);
      saveState();
      resetBtn.classList.remove('holding');
    }, 600);
  }
  function cancelPress(e) {
    e.stopPropagation();
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    resetBtn.classList.remove('holding');
  }

  resetBtn.addEventListener('touchstart', startPress, { passive: false });
  resetBtn.addEventListener('touchend', cancelPress);
  resetBtn.addEventListener('touchcancel', cancelPress);
  resetBtn.addEventListener('mousedown', startPress);
  resetBtn.addEventListener('mouseup', cancelPress);
  resetBtn.addEventListener('mouseleave', cancelPress);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* offline support is optional */ }
  });
}
</script>
</body>
</html>
